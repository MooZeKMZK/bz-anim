[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bz-anim-gui"
version = "0.1.0"
description = "Cross-platform Neo-Brutalist PySide6 GUI for the 2D Belousov-Zhabotinsky reaction-diffusion simulator"
requires-python = ">=3.10"
dependencies = [
    "bz-anim-core>=0.1.0",
    "bz-anim-cli>=0.1.0",
    "PySide6>=6.7.0",
]

[project.scripts]
bz-gui = "bz_anim_gui.gui:run_gui"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bz_anim_gui"]
