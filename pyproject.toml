[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bz-anim"
version = "0.1.0"
description = "Umbrella package for the 2D Belousov-Zhabotinsky reaction-diffusion simulator (CLI, Textual TUI, PySide6 GUI)"
requires-python = ">=3.10"
dependencies = [
    "bz-anim-core>=0.1.0",
    "bz-anim-cli>=0.1.0",
]

[project.optional-dependencies]
tui = ["bz-anim-tui>=0.1.0"]
gui = ["bz-anim-gui>=0.1.0"]
all = ["bz-anim-tui>=0.1.0", "bz-anim-gui>=0.1.0"]

[project.scripts]
bz-anim = "bz_anim:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["base", "cli", "tui", "gui", "theme", "bz_anim"]
