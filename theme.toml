# Neo-Brutalist UI Theme Configuration for bz-anim (TUI & GUI)

[surfaces]
ink = "#161821"          # Deep base & hard drop-shadow ink
surface = "#1e212d"      # Sidebar background
panel = "#262a38"        # Elevated card surface
paper = "#e8e4dc"        # Crisp borders & primary text
muted = "#9499ad"        # Secondary labels

[accents]
